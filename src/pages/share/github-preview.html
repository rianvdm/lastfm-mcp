<!doctype html>
<!--
	ABOUTME: Source of the 1280×640 GitHub social preview (.github/assets/github-preview.png): the share card, sized for GitHub and naming the repo.
	ABOUTME: Rendered by scripts/render-share-images.mjs with headless Chrome once data-ready is "ok"; uploaded by hand in the repo settings, never served.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Last.fm MCP GitHub social preview</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=block"
			rel="stylesheet"
		/>
		<style>
			html,
			body {
				margin: 0;
				width: 1280px;
				height: 640px;
				overflow: hidden;
			}

			body {
				position: relative;
				background: #ece6dc;
				color: #22201d;
				font-family: 'Bricolage Grotesque', sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			canvas {
				position: absolute;
				inset: 0;
			}

			.mark,
			.repo {
				position: absolute;
				top: 56px;
				font-size: 30px;
			}

			.mark {
				left: 80px;
				font-weight: 700;
			}

			.repo {
				right: 80px;
				color: #504a43;
				font-weight: 400;
			}

			.copy {
				position: absolute;
				left: 80px;
				top: 120px;
				width: 1120px;
			}

			h1 {
				width: 960px;
				margin: 0;
				font-size: 76px;
				line-height: 1.02;
				letter-spacing: -0.025em;
				font-weight: 700;
			}

			.summary {
				margin: 28px 0 0;
				color: #504a43;
				font-size: 32px;
				font-weight: 400;
			}
		</style>
	</head>
	<body>
		<canvas width="1280" height="640" aria-hidden="true"></canvas>
		<div class="mark">Last.fm MCP</div>
		<div class="repo">github.com/rianvdm/lastfm-mcp</div>
		<div class="copy">
			<h1>Ask your AI about everything you've ever listened to.</h1>
			<p class="summary">An open-source MCP server for Claude, ChatGPT, and other AI assistants</p>
		</div>

		<script src="wave.js"></script>
		<script>
			// The share card's wave, centred 90px above the bottom edge
			drawWave(document.querySelector('canvas'), { centre: 550, maxLayerThickness: 34, columnWidth: 6 })

			// The renderer captures only when data-ready is "ok": both Bricolage Grotesque weights have loaded, so no fallback
			// font gets in. load() resolves with no faces when the stylesheet never arrived, so an empty list is a failure too.
			const setReady = (state) => (document.documentElement.dataset.ready = state)
			Promise.all([document.fonts.load('700 76px "Bricolage Grotesque"'), document.fonts.load('400 32px "Bricolage Grotesque"')]).then(
				(loads) => setReady(loads.every((faces) => faces.length > 0) ? 'ok' : 'failed'),
				() => setReady('failed'),
			)
		</script>
	</body>
</html>
